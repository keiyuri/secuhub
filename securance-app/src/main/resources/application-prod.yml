# 운영 프로필 — WinSW로 Windows 서비스 등록 시 사용(계획서 7.1절).
spring:
  thymeleaf:
    cache: true

securance:
  security:
    dev-auto-login-enabled: false  # ⚠ 운영에서는 절대 true로 바꾸지 말 것 — 로그인 우회 임시 필터 차단용 재확인.

logging:
  level:
    root: WARN
    kr.co.securance.secuhub: INFO
  file:
    name: Logs/securance-app.log
