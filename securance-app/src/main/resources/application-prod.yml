# 운영 프로필 — WinSW로 Windows 서비스 등록 시 사용(계획서 7.1절).
#
# 리버스 프록시 등으로 TLS를 앞단에 두게 되면 반드시 아래를 추가할 것(적대적 리뷰 지적 — 평문
# HTTP 배포 전제라 기본 application.yml은 secure 쿠키를 강제하지 않는다):
#   server.servlet.session.cookie.secure: true
spring:
  thymeleaf:
    cache: true

  # 코드 리뷰 지적 S-1(2026-08-20): base application.yml이 이제 모든 프로필에서 SECURANCE_DB_URL/
  # USER/PASSWORD를 fallback 없이 강제하므로(spring.flyway.*도 FlywayDataSourceConfig가 같은
  # spring.datasource.* 값을 그대로 읽어 함께 적용된다), 여기서 다시 재정의할 필요가 없어졌다 —
  # 예전에는 base가 실 개발 DB를 기본값으로 깔아둬서 여기서 별도로 덮어써야 했다(중복/드리프트
  # 위험). RabbitMQ의 guest:guest 기본값은 여기서 강제하지 않는다 — securance.messaging.rabbitmq.enabled가
  # 기본 false라 아직 실제 연결을 시도하지 않는 배포도 있고, 스프링은 이 기동 플래그와 무관하게
  # spring.rabbitmq.* 프로퍼티를 바인딩 시점에 해석하므로 여기서 강제하면 RabbitMQ 미사용 배포까지
  # 기동이 막힌다. RabbitMQ를 실제로 켤 때는 반드시 SECURANCE_RABBITMQ_USER/PASSWORD를 명시할 것.

  # 기본 application.yml의 baseline-on-migrate=true는 로컬 개발 편의용이다(적대적 리뷰 지적) —
  # 기존 데이터가 있는 DB에 그 값 그대로 붙으면 Flyway가 현재 상태를 조용히 baseline으로 찍고
  # V1을 건너뛴 채 "성공"으로 기동해버릴 수 있다. 운영에서는 마이그레이션 이력이 없는 DB에 붙는
  # 것 자체가 이례적인 상황이므로, 반드시 실패시켜 운영자가 무슨 일이 있었는지 확인하게 한다 —
  # 신규 운영 DB를 처음 구축할 때는 이 값을 일시적으로 true로 켜고 기동한 뒤 다시 꺼둘 것.
  # url/user/password는 여기서 재정의하지 않는다 — SECURANCE_DB_URL에 이미 쿼리 파라미터(useSSL,
  # serverTimezone 등)가 포함된 운영 환경에서 물음표가 중복돼 잘못된 JDBC URL이 되는 문제(2026-08-14
  # Codex 리뷰 지적)를 막기 위해 kr.co.securance.secuhub.domain.config.FlywayDataSourceConfig가
  # spring.datasource.url을 그대로 읽어 안전하게 구성한다.
  flyway:
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    kr.co.securance.secuhub: INFO
  file:
    name: Logs/securance-app.log
  logback:
    rollingpolicy:
      # 롤링 정책이 없으면 상시 구동되는 Windows 서비스(WinSW)에서 로그 파일이 무제한으로
      # 커져 디스크를 고갈시킬 수 있다 — 일자별로 나누고 총 용량에 상한을 둔다.
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
