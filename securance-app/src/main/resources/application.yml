# securance-app 기본 설정(계획서 6절). 프로필별 값은 application-{profile}.yml로 분리한다
# (local/dev/prod). DB 자격증명은 레거시(ini 평문)와 달리 환경변수로 외부화한다.

spring:
  application:
    name: secuhub

  main:
    # securance-web(spring-boot-starter-web/MVC)과 securance-server(spring-boot-starter-webflux)가
    # 둘 다 클래스패스에 있다(적대적 리뷰 지적) — Spring Boot가 SERVLET을 자동 선택해 지금은
    # 정상 동작하지만, 그 선택이 코드 어디에도 명시돼 있지 않았다. 의도(대시보드는 서블릿 MVC,
    # 게이트 TCP 서버는 WebFlux의 Reactor Netty만 재사용하고 WebFlux 서버 자체는 띄우지 않음)를
    # 명시적으로 고정한다.
    web-application-type: servlet

  datasource:
    # 코드 리뷰 지적 S-1(2026-08-20): 예전에는 여기 실 개발 DB 주소·계정·비밀번호
    # (192.168.0.91:28030, dba/securance)가 기본값으로 박혀 있었다 — application-prod.yml만
    # fallback 없이 강제해, prod 프로필을 깜빡 지정하지 않은 실행(로컬/CI/테스트)은 조용히 그
    # 실 개발 서버에 붙어버릴 수 있었다(docs/작업일지.md 0036 항목에 실제 혼선 사례 기록).
    # 지금은 모든 프로필에서 환경변수를 fallback 없이 강제한다 — 설정을 빠뜨리면 (조용히 잘못된
    # DB에 붙는 대신) 기동 시점에 바로 실패한다. 로컬 개발은 application-local.yml.example을
    # application-local.yml로 복사해 값을 채우고 --spring.profiles.active=local로 실행할 것
    # (application-local.yml은 .gitignore에 등록되어 커밋되지 않는다).
    url: ${SECURANCE_DB_URL}
    username: ${SECURANCE_DB_USER}
    password: ${SECURANCE_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # 커넥션 풀에서 커넥션을 얻지 못할 때(풀 고갈/DB 응답 없음) 대기하는 상한.
      # 기본값(30초)은 GateDbWriteQueue 샤드 워커를 너무 오래 묶어둔다.
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        # 코루틴의 withTimeout()은 협조적 취소만 되는 suspend 코드에만 효과가 있고, JDBC 호출처럼
        # 블로킹인 채로 소켓 read에 멈춰 있는 스레드는 취소 신호를 받아도 풀려나지 않는다
        # (GateDbWriteQueue.kt 참고). 그래서 실제 "쿼리가 멈춰도 워커가 계속 진행한다"는 보장은
        # 코루틴 레벨이 아니라 이 드라이버 소켓 타임아웃이 만들어준다 — 응답이 이 시간 안에 오지
        # 않으면 드라이버가 SocketTimeoutException을 던져 블로킹 호출 자체를 끝내준다.
        socketTimeout: 5000
        connectTimeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만 — Hibernate가 스키마를 건드리지 않는다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Flyway 전용 커넥션의 socketTimeout/connectTimeout 재정의는 여기서 URL을 정적으로 이어붙이지
    # 않는다 — kr.co.securance.secuhub.domain.config.FlywayDataSourceConfig가 spring.datasource.url을
    # 그대로 읽어 쿼리 문자열 유무에 안전하게 대응하며 코드로 구성한다(그 클래스 KDoc 참고,
    # 2026-08-14 Codex 리뷰 지적 — SECURANCE_DB_URL에 이미 쿼리 파라미터가 있으면 여기서처럼
    # 정적으로 `?...`를 또 붙이면 물음표가 중복돼 잘못된 JDBC URL이 된다).

  thymeleaf:
    cache: false # 운영 프로필(application-prod.yml)에서 true로 재정의.

  servlet:
    multipart:
      # #5 SetupLocation 배치도 이미지 업로드 — 레거시도 10MB 초과 파일을 거부한다(SR_F_SetupLocation
      # pbImgSel_MouseClick의 FileInfo.Length > 10485760 체크와 동일 상한).
      max-file-size: 10MB
      max-request-size: 10MB

  # RabbitMQ/Redis는 항상 오토컨피규레이션 대상이며, 실제 연결 시도는 아래 securance.* 플래그로
  # on/off 제어한다(계획서 6절 — 재배포 없이 설정 변경만으로 전환).
  rabbitmq:
    host: ${SECURANCE_RABBITMQ_HOST:localhost}
    port: ${SECURANCE_RABBITMQ_PORT:5672}
    username: ${SECURANCE_RABBITMQ_USER:guest}
    password: ${SECURANCE_RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: ${SECURANCE_REDIS_HOST:localhost}
      port: ${SECURANCE_REDIS_PORT:6379}

  quartz:
    # RAMJobStore(레거시와 동일). JDBC JobStore로 바꿔 클러스터링하지 않는 것은 의도된 설계다 —
    # NetCheckJob/ReqStatusJob은 인스턴스 로컬 GateConnectionRegistry(그 인스턴스가 실제로 들고
    # 있는 TCP 커넥션 집합)만 보고 동작하므로, Quartz 클러스터링으로 "인스턴스 중 하나만 실행"하게
    # 만들면 다른 인스턴스에 연결된 게이트가 영원히 폴링되지 않는다. 두 잡은 인스턴스마다 독립
    # 실행돼야 한다(securance-server GateControlDispatcher KDoc 참고). tb_data_snd처럼 인스턴스
    # 간에 공유되는 상태는 Quartz 클러스터링이 아니라 DB 낙관적 잠금(DataSend.version)으로
    # 동시성을 제어한다(3차 스프린트).
    job-store-type: memory
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 10

securance:
  server:
    mode: SERVER               # SERVER | CLIENT — 백엔드↔게이트 TCP 연결 방향(계획서 3.1절)
    host: 0.0.0.0
    # 버그 수정(2026-08-13, B2): 2026-08-07(5)에서 ServerModeConfig.kt 기본값을 실제 게이트 장비
    # 포트(28010/1005)로 고쳤지만 이 yml은 그 이전 자리표시자 값(9000)에 머물러 있었다 — yml이
    # 코드 기본값을 항상 덮어써 SERVER 바인딩/CLIENT 접속이 실제로는 계속 잘못된 포트를 썼다.
    port: 28010
    client-port: 1005
    accept-backlog: 2048
    actor-queue-capacity: 2000
    db-writer-shards: 8        # 1,000+ 디바이스 규모에서는 16~32 권장(계획서 3.7절)

  scheduler:
    job-concurrency: 64        # Quartz 잡 팬아웃 동시성 상한(계획서 3.7절)
    net-check-interval-seconds: 5
    req-status-interval-seconds: 10   # ReqStatusJob 상태 폴링 주기(계획서 3.6절)

  control:
    dispatch-mode: QUEUED      # QUEUED | DIRECT — 프론트엔드 제어 명령 전송 방식(연결 방향과 독립, 계획서 5.5절)
    poll-interval-seconds: 1   # SendControlJob 폴링 주기(레거시 INTERVAL_SEND_CONTROL)
    batch-size: 200            # 폴링 1회 처리 상한 — 대기열 폭증 시 한 사이클이 길어지는 것을 방지
    resend-guard-seconds: 5    # 같은 명령의 물리 재전송 최소 간격(레거시 RESEND_GUARD)
    ack-timeout-seconds: 10    # 장비 ACK 대기 시간 — 초과 시 재전송 또는 실패 확정
    max-send-attempts: 3       # ACK 미수신 시 최대 전송 시도 횟수(최초 전송 포함)
    pending-expiry-seconds: 300 # 전송조차 못한 대기 명령의 최대 대기 시간 — 초과 시 실패 확정(헤드 오브 라인 차단 방지, R-1)

  # 레거시 ini [LOCATION]/[CLOUD] 섹션 대응 — 설정 스캐폴드만 추가한다. 실사용처는 레거시에서도
  # 불분명했으므로 이번 작업에서는 로직을 구현하지 않는다(과도한 억측 금지).
  location:
    place-cd: ""                # 레거시 [LOCATION] PLACE_CD
    group-cd: ""                # 레거시 [LOCATION] GROUP_CD
    image-dir: ${SECURANCE_LOC_IMAGE_DIR:./data/loc-images} # #5 SetupLocation 배치도 이미지 저장 경로(WebConfig가 /loc-images/**로 서빙)

  cloud:
    addr: ""                    # 레거시 [CLOUD] CLOUD_ADDR
    port: 0                     # 레거시 [CLOUD] CLOUD_PORT

  messaging:
    rabbitmq:
      enabled: false            # true로 바꾸면 RabbitGateEventPublisher가 활성화된다(후속 작업, 계획서 5.3절).

  cache:
    redis:
      enabled: false            # true로 바꾸면 Redis 세션/캐시가 활성화된다(후속 작업).

  # 로그인 기능 on/off 설정(2026-08-12 사용자 확인, Phase 10 후속). 값 변경은 재기동이 필요하다
  # (다른 securance.* 플래그와 동일 — authorizeHttpRequests/인터셉터는 기동 시 1회만 조립됨).
  security:
    web-login-required: true          # false면 웹 화면 전체가 로그인 없이 열린다(admin/control/게이트 제어 API 규칙은 예외 없이 그대로 적용)
    gate-control-reauth-required: false  # true면 리셋/모드변경/모터설정 등 게이트 제어 실행마다 비밀번호 재입력을 요구

# 헬스체크/메트릭(2026-08-13 코드 리뷰 지적) — 게이트 TCP 연결/DB 쓰기 큐 적체 등 장애를
# 로그 파일 육안 확인 없이도 외부 모니터링(Prometheus 등)에서 감지할 수 있게 최소한만 노출한다.
# /actuator/health는 SecurityConfig에서 permitAll, 나머지 액추에이터 경로는 ROLE_ADMIN 필요.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
  servlet:
    session:
      # 세션 쿠키 보안 속성(적대적 리뷰 지적) — 전부 미설정이었다. `secure`는 여기서 강제하지 않는다:
      # 이 프로젝트는 현재 TLS 종료 지점(리버스 프록시 등) 없이 평문 HTTP로 배포되므로(README에
      # HTTPS 안내 없음), secure=true를 강제하면 브라우저가 쿠키를 아예 보내지 않아 로그인 자체가
      # 깨진다 — TLS를 앞단에 두게 되면 `server.servlet.session.cookie.secure=true`를 반드시 켤 것.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

logging:
  level:
    kr.co.securance.secuhub: INFO
  # 요청 상관관계 ID(RequestCorrelationFilter, 2026-08-13 코드 리뷰 지적)를 로그 라인에 포함시킨다.
  # requestId가 없는 로그(TCP 게이트 처리, 스케줄러 잡 등)에서는 빈 문자열로 찍힌다.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
