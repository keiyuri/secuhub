<!DOCTYPE html>
<!--/*
  계획서 5.2절: 위젯 추가/수정 가능한 관리자 대시보드.
  Phase 3(계획서 4절 확정 결정: "WebSocket + 폴링")부터 SmallBox 4종 + 오류 테이블이
  dashboard-realtime.js를 통해 실시간 갱신된다 — id="rt-*"는 그 스크립트가 갱신 대상을
  찾는 훅이다(서버 최초 렌더값은 페이지 로드 직후 값, 이후 WebSocket push로 대체됨).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard-layout}">
<head><title>대시보드</title></head>
<body>
<div layout:fragment="content">

  <!-- 1행: 요약 지표(SmallBox) — adminlte-react widgets/small-box 패턴, col-lg-3 col-6 그리드 -->
  <!--/* 2026-08-12(B8): id는 fragment가 <h3>에 직접 부착한다 — 이전의 DOM-순서 기반 사후 부착
        스크립트는 카드 재배치 시 엉뚱한 박스가 갱신될 수 있어 제거했다. */-->
  <div class="row">
    <div class="col-lg-3 col-6" th:replace="~{fragments/widgets/small-box :: smallBox(
           'rt-online-count', ${summary.onlineGateCount}, '온라인 게이트', 'bi-hdd-network', 'success', '/gates/reset', '자세히')}"></div>
    <div class="col-lg-3 col-6" th:replace="~{fragments/widgets/small-box :: smallBox(
           'rt-offline-count', ${summary.offlineGateCount}, '오프라인 게이트', 'bi-hdd-network-fill', 'danger', '/gates/reset', '자세히')}"></div>
    <div class="col-lg-3 col-6" th:replace="~{fragments/widgets/small-box :: smallBox(
           'rt-unresolved-count', ${summary.unresolvedErrorCount}, '미해결 오류', 'bi-exclamation-triangle', 'warning', '/reports/events?resolveYn=N', '자세히')}"></div>
    <div class="col-lg-3 col-6" th:replace="~{fragments/widgets/small-box :: smallBox(
           'rt-traffic-count', ${summary.todayTrafficCount}, '오늘 통행량', 'bi-people', 'info', '/control/history', '자세히')}"></div>
  </div>

  <!-- Phase 10: #18 대시보드 게이트 트리뷰 — LOC/GRP/DTL 3계층 + 연결상태 아이콘 + 우클릭 제어 메뉴.
       레거시 UI 원본이 이 워크스페이스에 없어 계획서 요구사항만으로 신규 설계했다(2026-08-12
       사용자 확인 — GateTreeApiController 참고). -->
  <div class="row">
    <div class="col-12">
      <div th:replace="~{fragments/widgets/card :: card(
             'widget-gate-tree', '게이트 트리뷰', 'primary', 'outline',
             true, true, false, ~{::#gateTreeBody})}"></div>

      <div th:block id="gateTreeBody" th:remove="tag">
        <div id="gate-tree" class="gate-tree" data-loading="true">
          <div class="text-muted small">불러오는 중...</div>
        </div>
        <!-- 우클릭 메뉴 — LOC(설치위치)/GRP(게이트그룹)/DTL(레인) 3계층 노드 전부 대상.
             레거시 SR_Speed_Client 트리(SR_F_DashBoard.TreeView.cs tvNet_NodeMouseClick 주석:
             "LOC/GRP/DTL 모든 노드에서 게이트 제어 메뉴 표시")도 세 계층 전부에서 우클릭 메뉴를
             띄웠다 — 다만 실제 게이트 IP/레인 단위 명령(개방/폐쇄/리셋/모드변경/모터설정)은 DTL
             노드에서만 의미가 있어 data-requires-node-type="dtl"로 좁힌다. LOC/GRP 노드는 대신
             해당 위치/그룹을 관리하는 화면을 열도록 별도 항목을 둔다 — 모달을 직접 열지 않고,
             사이드바 "모니터링 > 게이트 관리" 그룹의 실제 메뉴 항목(위치/게이트그룹,
             MenuProvider.kt의 popup=true)을 gate-tree.js가 그대로 클릭해 실행한다(2026-08-19
             사용자 요청 — 모달 오픈 로직·제목의 중복을 없애고 사이드바 클릭과 동일한 진입점을
             타도록 일원화; href 리터럴 자체는 셀렉터 키로 gate-tree.js에도 남아 있다).
             GateControlApiController(개방/폐쇄/복구/FREE/역방향 개방·리셋)/GateControlController(모드 변경·모터 설정)를
             그대로 재사용한다.
             DTL 상단 5개 항목(개방~역방향 개방)은 SR_Speed_Client 트리뷰(SR_F_DashBoard.GateControl.cs
             ContextMenu_Init)와 동일 구성(2026-08-19 사용자 요청) — 역방향 개방은 Flap 타입
             (gate_type_code=2) 게이트에만 표시되며, gate-tree.js가 우클릭 시점에 data-gate-type을
             보고 show/hide한다. -->
        <ul id="gate-tree-context-menu" class="dropdown-menu gate-tree-context-menu" style="display:none; position:fixed;">
          <li><h6 class="dropdown-header gate-tree-context-target">게이트</h6></li>
          <li data-requires-node-type="loc"><a class="dropdown-item" href="#" data-action="manage-location"><i class="bi bi-geo-alt"></i> 위치 관리</a></li>
          <li data-requires-node-type="grp"><a class="dropdown-item" href="#" data-action="manage-group"><i class="bi bi-diagram-3"></i> 게이트그룹 관리</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="gate-open"><i class="bi bi-unlock"></i> 게이트 상시 개방</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="gate-close"><i class="bi bi-lock"></i> 게이트 상시 폐쇄</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="gate-normal"><i class="bi bi-arrow-counterclockwise"></i> 게이트 정상 복구</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="gate-free"><i class="bi bi-unlock-fill"></i> 게이트 FREE 모드</a></li>
          <li data-requires-node-type="dtl" data-requires-gate-type="2"><a class="dropdown-item" href="#" data-action="gate-reverse-open"><i class="bi bi-arrow-left-right"></i> 게이트 역방향 개방</a></li>
          <li data-requires-node-type="dtl"><hr class="dropdown-divider"></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="reset-system"><i class="bi bi-arrow-clockwise"></i> 시스템 리셋</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="reset-motor"><i class="bi bi-arrow-clockwise"></i> 모터 리셋</a></li>
          <li data-requires-node-type="dtl"><hr class="dropdown-divider"></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="mode-change"><i class="bi bi-sliders"></i> 모드 변경</a></li>
          <li data-requires-node-type="dtl"><a class="dropdown-item" href="#" data-action="motor-setup"><i class="bi bi-gear"></i> 모터 설정</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 2행: 위젯 카드 컬럼 — SortableJS 드래그 재배치(계획서 5.2절), 위젯 추가/삭제는 후속 작업 -->
  <div class="row">
    <div class="col-lg-7 connectedSortable">

      <div th:replace="~{fragments/widgets/card :: card(
             'widget-gate-errors', '게이트 상태 요약 (uvw_anlz_error 대응)', 'danger', 'outline',
             true, true, true, ~{::#gateErrorsBody})}"></div>

      <div th:block id="gateErrorsBody" th:remove="tag">
        <div class="table-responsive">
          <table class="table table-sm table-striped">
            <thead>
              <tr><th>게이트</th><th>오류</th><th>발생일시</th><th>해결여부</th></tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(recentErrors)}">
                <td colspan="4" class="text-center text-muted">최근 미해결 오류가 없습니다.</td>
              </tr>
              <tr th:each="err : ${recentErrors}">
                <td th:text="${err.dtlIp}">IP</td>
                <td th:text="${err.description}">오류 설명</td>
                <td th:text="${err.analDate}">일시</td>
                <td th:text="${err.resolveYn}">N</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="col-lg-5 connectedSortable">

      <div th:replace="~{fragments/widgets/card :: card(
             'widget-traffic', '통행량 (uvw_user_cnt 대응)', 'info', 'outline',
             true, true, false, ~{::#trafficBody})}"></div>

      <div th:block id="trafficBody" th:remove="tag">
        <div th:replace="~{fragments/widgets/info-box :: infoBox(
               '오늘 총 통행량', ${summary.todayTrafficCount}, 'bi-graph-up', 'info', null, null)}"></div>
      </div>

    </div>
  </div>

  <!-- #1 GateControl(장애 알림 팝업) / #17 Warning(화재 경고 팝업). 리셋 실행 버튼은
       GateControlApiController(/api/gate-control/reset)가 구현된 뒤부터 여기서도 호출한다
       (2026-08-11 B3 — 백엔드는 완성돼 있었는데 이 팝업만 배선이 안 돼 있었다). -->
  <div class="modal fade" id="rt-alert-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">알림</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <dl class="row mb-0">
            <dt class="col-4">게이트 IP</dt><dd class="col-8 rt-alert-ip">-</dd>
            <dt class="col-4">내용</dt><dd class="col-8 rt-alert-desc">-</dd>
            <dt class="col-4">발생일시</dt><dd class="col-8 rt-alert-date">-</dd>
          </dl>
          <div class="rt-alert-result small mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger rt-alert-reset">
            <i class="bi bi-arrow-clockwise"></i> 리셋 실행
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">확인</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 레이아웃 기본 scripts 프래그먼트(dashboard-widgets.js)에 실시간 갱신 스크립트를 추가한다. -->
<th:block layout:fragment="scripts">
  <script th:src="@{/js/dashboard-widgets.js}"></script>
  <script th:src="@{/js/dashboard-realtime.js}"></script>
  <script th:src="@{/js/gate-tree.js}"></script>
</th:block>
</body>
</html>
