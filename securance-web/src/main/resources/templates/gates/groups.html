<!DOCTYPE html>
<!--/* #4 SR_F_SetupGateGroup — 위치→그룹 2단 콤보 검색 + 그룹 CRUD. */-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard-layout}">
<head><title>게이트그룹 관리</title></head>
<body>
<div layout:fragment="content">

  <div class="alert alert-success py-2" th:if="${message}" th:text="${message}"></div>

  <div class="card card-outline card-secondary mb-3">
    <div class="card-body py-2">
      <form method="get" th:action="@{/gates/groups}" class="row g-2 align-items-end">
        <div class="col-auto">
          <label class="form-label mb-0">위치</label>
          <select name="locId" class="form-select form-select-sm" onchange="this.form.submit()">
            <option value="">전체</option>
            <option th:each="loc : ${allLocations}" th:value="${loc.locId}" th:text="${loc.locName}"
                    th:selected="${loc.locId == selectedLocId}"></option>
          </select>
        </div>
      </form>
    </div>
  </div>

  <!-- 버그 수정(2026-08-21): [locations.html]과 동일한 지적 — 레거시 SR_F_SetupGateGroup은 등록/수정
       폼이 팝업(모달)로 뜨는데, 이 화면은 목록 옆에 폼을 상시 노출하는 2단 레이아웃이었다. 폼을
       Bootstrap 모달로 옮기고 "신규 등록"/"수정"이 모달을 띄우도록 바꿨다. -->
  <div class="row">
    <div class="col-lg-12">
      <div class="card card-outline card-primary">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3 class="card-title">게이트그룹 목록</h3>
          <!-- 버그 수정(2026-08-21, 재검토): locations.html과 동일한 이유 — editingId가 채워진 채
               렌더링된 페이지(=/edit GET으로 진입)에서는 "신규 등록"이 서버 렌더된 수정 모달을 그대로
               다시 열어 기존 그룹을 덮어쓸 위험이 있었다. editingId가 있을 때는 실제 링크로 만들어
               선택된 위치 필터를 유지한 채 새 폼 상태로 페이지를 다시 불러오게 한다. -->
          <!-- 버그 수정(Opus 전체 리뷰, 2026-08-21): ${editingId}는 null 체크가 아니라 Thymeleaf
               진리값 평가를 탄다 — PK가 0인 레거시 이관 행에서는 false가 되어 분기가 뒤집힌다.
               명시적으로 null 비교한다. -->
          <button th:if="${editingId == null}" type="button" class="btn btn-sm btn-primary"
                  data-bs-toggle="modal" data-bs-target="#groupFormModal">
            <i class="bi bi-plus-lg"></i> 신규 등록
          </button>
          <a th:if="${editingId != null}" class="btn btn-sm btn-primary" th:href="@{/gates/groups(locId=${selectedLocId})}">
            <i class="bi bi-plus-lg"></i> 신규 등록
          </a>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped mb-0">
            <thead><tr><th>위치</th><th>그룹명</th><th>레인수</th><th>게이트타입</th><th>사용</th><th></th></tr></thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(groups)}">
                <td colspan="6" class="text-center text-muted">등록된 게이트그룹이 없습니다.</td>
              </tr>
              <tr th:each="grp : ${groups}">
                <td th:text="${grp.location.locName}">위치</td>
                <td th:text="${grp.grpName}">그룹명</td>
                <td th:text="${grp.laneCount}">1</td>
                <td th:text="${grp.gateTypeCode}">1</td>
                <td th:text="${grp.useYn} ? '사용' : '미사용'">사용</td>
                <td class="text-end text-nowrap">
                  <a class="btn btn-sm btn-outline-secondary" th:href="@{/gates/details(grpId=${grp.grpId})}">레인</a>
                  <a class="btn btn-sm btn-outline-secondary" th:href="@{/gates/groups/{id}/edit(id=${grp.grpId})}">수정</a>
                  <form th:action="@{/gates/groups/{id}/delete(id=${grp.grpId})}" method="post" class="d-inline"
                        onsubmit="return confirm('삭제하시겠습니까? 하위 레인이 있으면 실패합니다.');">
                    <input type="hidden" name="locId" th:value="${selectedLocId}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 등록/수정 팝업(모달) — 레거시 SR_F_SetupGateGroup과 동일하게 목록 화면 위에 오버레이로 뜬다. -->
  <div class="modal fade" id="groupFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form th:action="${editingId != null} ? @{/gates/groups/{id}(id=${editingId})} : @{/gates/groups}"
              th:object="${form}" method="post">
          <div class="modal-header">
            <h5 class="modal-title" th:text="${editingId != null} ? '게이트그룹 수정' : '게이트그룹 등록'">게이트그룹 등록</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">위치</label>
              <select class="form-select" th:field="*{locId}"
                      th:classappend="${#fields.hasErrors('locId')} ? 'is-invalid'">
                <option value="">선택하세요</option>
                <option th:each="loc : ${allLocations}" th:value="${loc.locId}" th:text="${loc.locName}"></option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('locId')}" th:errors="*{locId}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">그룹명</label>
              <input type="text" class="form-control" th:field="*{grpName}"
                     th:classappend="${#fields.hasErrors('grpName')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('grpName')}" th:errors="*{grpName}"></div>
            </div>
            <div class="mb-3">
              <!--/* 레인수+1 = 물리 게이트 수(펜스포스트 규칙, GateGroup.physicalGateCount 참고). */-->
              <label class="form-label">레인 수</label>
              <input type="number" min="1" class="form-control" th:field="*{laneCount}"
                     th:classappend="${#fields.hasErrors('laneCount')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('laneCount')}" th:errors="*{laneCount}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">게이트 타입</label>
              <select class="form-select" th:field="*{gateTypeCode}"
                      th:classappend="${#fields.hasErrors('gateTypeCode')} ? 'is-invalid'">
                <option value="">선택하세요</option>
                <option th:each="code : ${gateTypes}" th:value="${code.id.codeCd}" th:text="${code.codeName}"></option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('gateTypeCode')}" th:errors="*{gateTypeCode}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">연결 방식</label>
              <select class="form-select" th:field="*{linkType}">
                <option value="1">1:1</option>
                <option value="2">1:N</option>
              </select>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" class="form-check-input" th:field="*{useYn}"/>
              <label class="form-check-label">사용</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
            <button type="submit" class="btn btn-primary" th:text="${editingId != null} ? '수정' : '등록'">등록</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 모달 자동 오픈 스크립트 — locations.html/groups.html/details.html 3중 복붙을 공유 프래그먼트로
       추출했다(Opus 리뷰 지적, 2026-08-21). 조건은 [fragments/modal-auto-open.html] 참고. -->
  <th:block th:replace="~{fragments/modal-auto-open :: autoOpen('groupFormModal', ${editingId != null or #fields.hasErrors('form.*')})}"></th:block>

</div>
</body>
</html>
