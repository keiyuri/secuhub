<!DOCTYPE html>
<!--/*
  #12 SR_P_GateModeChange — 개별 게이트 운영/보안 모드 변경 팝업(계획서 Phase 4).
  시간대 스케줄 선택(레거시 cmbUserSch/cmbSecuSch)은 Phase 5(TimeZone 엔티티) 전까지 미제공 —
  "미선택" 기본 동작과 동일하게 처리된다(GateControlController 주석 참고).
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard-layout}">
<head><title>게이트 모드 변경</title></head>
<body>
<div layout:fragment="content">

  <div class="card card-outline card-primary" style="max-width: 640px;">
    <div class="card-header">
      <h3 class="card-title">모드 변경 — <span th:text="${detail.dtlIp}">IP</span> / 레인 <span th:text="${detail.dtlLaneNo}">0</span></h3>
    </div>
    <div class="card-body">
      <p class="text-muted" th:text="${detail.dtlName}">게이트 이름</p>

      <form th:action="@{/gates/details/{id}/mode(id=${detail.dtlId})}" th:object="${form}" method="post">
        <fieldset class="mb-4">
          <legend class="fs-6 fw-bold">운영 모드</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="userMode" id="userMode-CC" value="CC" th:checked="${form.userMode == 'CC'}"/>
            <label class="form-check-label" for="userMode-CC">CC — 카드+카드(기본)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="userMode" id="userMode-CF" value="CF" th:checked="${form.userMode == 'CF'}"/>
            <label class="form-check-label" for="userMode-CF">CF — 카드+프리</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="userMode" id="userMode-FC" value="FC" th:checked="${form.userMode == 'FC'}"/>
            <label class="form-check-label" for="userMode-FC">FC — 프리+카드</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="userMode" id="userMode-FF" value="FF" th:checked="${form.userMode == 'FF'}"/>
            <label class="form-check-label" for="userMode-FF">FF — 프리+프리</label>
          </div>
        </fieldset>

        <fieldset class="mb-4">
          <legend class="fs-6 fw-bold">보안 모드</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="secuMode" id="secuMode-LM" value="LM" th:checked="${form.secuMode == 'LM'}"/>
            <label class="form-check-label" for="secuMode-LM">LM — 낮음(기본)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="secuMode" id="secuMode-MM" value="MM" th:checked="${form.secuMode == 'MM'}"/>
            <label class="form-check-label" for="secuMode-MM">MM — 보통</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="secuMode" id="secuMode-HM" value="HM" th:checked="${form.secuMode == 'HM'}"/>
            <label class="form-check-label" for="secuMode-HM">HM — 높음</label>
          </div>
        </fieldset>

        <div th:replace="~{fragments/widgets/reauth-field :: reauthField()}"></div>

        <button type="submit" class="btn btn-primary">적용(전송 대기열 등록)</button>
        <a class="btn btn-secondary" th:href="@{/gates/details(grpId=${detail.group.grpId})}">취소</a>
      </form>
    </div>
  </div>

</div>
</body>
</html>
