<!DOCTYPE html>
<!--/* 계획서 5.4절: adminlte-react AuthLayout(login-page)과 동일한 body 클래스 관례. */-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>로그인 · securance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" th:href="@{/vendor/adminlte/css/adminlte.min.css}"/>
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <span class="h1"><b>securance</b></span>
      </div>
      <div class="card-body">
        <p class="login-box-msg">계정으로 로그인하세요</p>
        <div class="alert alert-danger py-2" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div class="alert alert-success py-2" th:if="${param.logout}">로그아웃되었습니다.</div>
        <!--/* SecurityConfig의 sessionConcurrency(EvictedSessionRedirectStrategy)가 다른 위치의
             새 로그인으로 세션이 밀려났을 때 이 파라미터와 함께 로그인 화면으로 돌려보낸다. */-->
        <div class="alert alert-warning py-2" th:if="${param.expired}">다른 위치에서 로그인하여 세션이 만료되었습니다.</div>
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="아이디" required autofocus/>
          </div>
          <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="비밀번호" required/>
          </div>
          <button type="submit" class="btn btn-primary d-block w-100">로그인</button>
        </form>
      </div>
    </div>
  </div>
  <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
